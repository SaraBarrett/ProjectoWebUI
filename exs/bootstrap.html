<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap</title>
    <!-- css Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />


    <!-- vosso css -->
  </head>
  <body>
    <section class="container mt-3 w-50 text-center ">
      <i class="bi bi-airplane"></i>
      <div>
        <div>
          <h1 class="text-light bg-dark text-center">Bad News</h1>
        </div>
        <div role="alert" class="alert alert-warning">
          You are going to die one day! It sucks, but it's normal :(
        </div>
        <div>
          <button type="button" class="btn btn-success">
            Come To Terms With
          </button>
          <button type="button" class="btn btn-dark">Continue To Deny</button>
        </div>
      </div>
    </section>

    <!-- js bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
