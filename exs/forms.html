<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulários</title>
  </head>
  <body>
    <h1>Race Registration!</h1>

    <form>
      <label for="first-name">First Name</label>
      <input type="text" id="first-name" required />

      <label for="last-name">Last Name</label>
      <input type="text" id="last-name" required  />

      <br /><br />

      <p>Select a Race:</p>

      <input type="radio" id="fun-run"  value="fun-run" />
      <label for="fun-run">Fun Run 5k</label>
      <br />

      <input
        type="radio"
        id="half-marathon"
       
      />
      <label for="half-marathon">Half Marathon</label>
      <br />

      <input
        type="radio"
        id="full-marathon"
        name="race"
        checked
      />
      <label for="full-marathon">Full Marathon</label>

      <br /><br />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <br /><br />

      <label for="age-group">Select Age Group</label>
      <select id="age-group">
        <option value="under-18">under 18</option>
        <option value="18-30">18-30</option>
        <option value="31-50">31-50</option>
        <option value="over-50">over 50</option>
      </select>

      <br /><br />

      <button type="submit">Register!</button>
    </form>
  </body>
</html>
